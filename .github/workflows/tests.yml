name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m unittest discover -s tests -v

  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Register local tap
        run: brew tap --custom-remote kitevi/bend "$GITHUB_WORKSPACE"
      - run: brew install kitevi/bend/bend
      - run: brew test kitevi/bend/bend
      - run: brew audit --strict kitevi/bend/bend
      - run: brew style kitevi/bend/bend
